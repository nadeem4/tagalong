[project]
name = "brain"
version = "0.1.0"
description = "Tagalong brain: the Python side of contract v1"
license = "GPL-3.0-or-later"
requires-python = ">=3.12,<3.14"
dependencies = [
    "agent-client-protocol==0.12.1",
    "anthropic>=2.3.0",
    "cryptography==50.0.2",
    "faster-whisper==1.2.1",
    "httpx2>=2.16.0",
    "kokoro-onnx==0.6.1",
    "ifaddr==0.2.0",
    "mcp==2.3.0",
    "moonshine-voice==0.1.5",
    "numpy==2.5.4",
    "onnxruntime==1.31.1",
    "piper-tts==1.8.0",
    "pydantic>=2.14.1",
    "pypdf==7.0.1",
    "segno==1.6.6",
    "supertonic==1.3.1",
    "websockets>=17.3",
    "zeroconf==0.154.0",
]

[project.scripts]
brain = "brain.main:main"
tagalong = "brain.cli:main"

[project.gui-scripts]
brain-service = "brain.main:service_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-testmon>=2.3.1",
    "ruff>=0.17.2",
]
