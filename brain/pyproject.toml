[project]
name = "brain"
version = "0.0.0"
description = "Tagalong brain: the Python side of contract v1"
requires-python = ">=3.12"
dependencies = [
    "agent-client-protocol==0.12.1",
    "anthropic>=2.3.0",
    "mcp==2.3.0",
    "pydantic>=2.14.1",
    "websockets>=17.3",
]

[project.scripts]
brain = "brain.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]
