name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to a pull request cancels its older run. Every push to main gets its own group, so
# none is cancelled or dropped from the queue: each compares against the push before it, and a
# dropped run would leave that push's code changes untested.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists a pull request's files through the API

jobs:
  # Docs-only changes skip the real jobs. This is a job, not a `paths-ignore` trigger: a
  # workflow that never starts never reports `build` or `e2e`, and a required check that never
  # reports keeps a pull request waiting forever. A job skipped by its `if:` reports as
  # skipped, which branch protection accepts.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: every
          # `code`: any file outside docs/ that is not Markdown.
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  # Everything that runs anywhere runs here, on Linux: a Linux minute bills at half a Windows one.
  # It also runs when `changes` itself failed: a skipped required check counts as passed, so
  # skipping here would let a broken filter wave a code change through.
  build:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (with coverage)
        run: pnpm test:coverage

  # The Python brain. Gated like `build`; a required check.
  brain:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brain

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Test
        run: uv run pytest

  # The server image: built, never pushed. Layers are cached between runs, so only a change to
  # the brain's dependencies or code rebuilds them. Gated like `build`.
  image:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: tagalong:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Only the network port is exposed
        run: |
          test "$(docker image inspect tagalong:ci --format '{{json .Config.ExposedPorts}}')" = '{"47323/tcp":{}}'

      - name: The first start prints a pairing link and the brain stays up
        run: |
          docker run -d --name brain -e TAGALONG_PUBLIC_HOST=example.test tagalong:ci
          sleep 30
          docker logs brain > serve.log 2>&1
          cat serve.log
          test "$(docker inspect -f '{{.State.Running}}' brain)" = true
          grep -q 'tagalong://pair?addr=example.test:47323' serve.log
          grep -q 'brain listening on wss://0.0.0.0:47323' serve.log
          timeout 20 docker stop -t 10 brain
          test "$(docker inspect -f '{{.State.ExitCode}}' brain)" != 137

  # Only what needs Windows, and only once the Linux job is green.
  e2e:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Compiles the workspace packages (their package.json entries point at dist), which the
      # tests below import, and the desktop app the Playwright suites start. On Linux the
      # Typecheck step's `tsc -b` does the same job before the tests.
      - name: Build
        run: pnpm build

      # The desktop runs the person's own `tagalong` through `uv run --no-sync`, which the
      # needs-you suite exercises for real, so the brain's environment has to exist.
      - uses: astral-sh/setup-uv@v7

      - name: Brain environment
        run: uv sync --locked
        working-directory: brain

      # The unit tests that skip themselves off Windows: the real PowerShell transport and
      # recogniser.
      - name: Windows-only unit tests
        run: pnpm exec vitest run integration.test

      # The runner is windows-latest, which has an interactive desktop session, so Electron
      # opens real windows and needs no xvfb-style wrapper. The step is capped because
      # Electron answers an uncaught main-process exception with a *modal* dialog, which
      # blocks the event loop: without a cap such a failure hangs the job instead of failing it.
      - name: Smoke test (Electron end-to-end)
        run: pnpm --filter @tagalong/desktop test:e2e
        timeout-minutes: 10

      # What Playwright saw when a suite failed: page snapshots and screenshots.
      - name: Upload e2e results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: bodies/desktop/test-results
          if-no-files-found: ignore
