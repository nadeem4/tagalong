name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Windows is the primary development target. macOS and Linux join in Phase 7.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (with coverage)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      # The runner is windows-latest, which has an interactive desktop session, so Electron
      # opens real windows and needs no xvfb-style wrapper (that would only be needed if
      # this job ever moved to a Linux runner). The step is capped because Electron answers
      # an uncaught main-process exception with a *modal* dialog, which blocks the event
      # loop: without a cap such a failure hangs the job instead of failing it.
      - name: Smoke test (Electron end-to-end)
        run: pnpm --filter @tagalong/desktop test:e2e
        timeout-minutes: 10

      # What Playwright saw when a suite failed: page snapshots and screenshots.
      - name: Upload e2e results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: apps/desktop/test-results
          if-no-files-found: ignore
