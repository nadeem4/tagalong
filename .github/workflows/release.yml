# Builds the Windows installer when a v* tag is pushed and attaches it to a GitHub release.
# The tag must match the desktop version, so a release never carries a mislabelled installer.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # gh release create

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tag matches the desktop version
        shell: bash
        run: |
          version=$(node -p "require('./bodies/desktop/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match desktop version v$version" >&2
            exit 1
          fi

      - run: pnpm package:win

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" bodies/desktop/release/*.exe --generate-notes
