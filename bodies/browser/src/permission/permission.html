<!doctype html>
<!-- The permission window. A page of its own because chrome.permissions.request must run in a
     click handler; permission.ts fills it in from the query string. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tagalong permission</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        font-size: 14px;
        margin: 20px;
        color: #1a1a1a;
        background: #ffffff;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 16px;
        line-height: 1.4;
      }
      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      button {
        font: inherit;
        padding: 6px 12px;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #f2f2f2;
          background: #1c1c1c;
        }
      }
    </style>
  </head>
  <body>
    <h1 id="title">Scout would like your permission</h1>
    <p id="reason"></p>
    <div class="buttons" id="buttons"></div>
    <script type="module" src="./permission.ts"></script>
  </body>
</html>
