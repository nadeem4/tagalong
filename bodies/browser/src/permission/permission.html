<!doctype html>
<!-- The permission window. A page of its own because chrome.permissions.request must run in a
     click handler; permission.ts fills it in from the query string. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tagalong permission</title>
    <style>
      :root {
        --ink: #12162b;
        --page: #ffffff;
      }
      body {
        font-family: 'Onest', system-ui, sans-serif;
        font-size: 14px;
        line-height: 21px;
        margin: 20px;
        color: var(--ink);
        background: var(--page);
      }
      h1 {
        font-size: 16px;
        line-height: 22px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 16px;
        line-height: 21px;
      }
      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      button {
        font: inherit;
        padding: 6px 12px;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e9ecf5;
          --page: #12162b;
        }
      }
    </style>
  </head>
  <body>
    <h1 id="title">Scout would like your permission</h1>
    <p id="reason"></p>
    <div class="buttons" id="buttons"></div>
    <script type="module" src="./permission.ts"></script>
  </body>
</html>
