<!doctype html>
<!-- Where the person allows the microphone. The hidden mic page cannot show Chrome's prompt, so
     this page does, from a click; mic.ts has the logic. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tagalong microphone</title>
    <style>
      :root {
        --ink: #12162b;
        --page: #ffffff;
      }
      body {
        font-family: 'Onest', system-ui, sans-serif;
        font-size: 14px;
        line-height: 21px;
        margin: 20px;
        max-width: 420px;
        color: var(--ink);
        background: var(--page);
      }
      h1 {
        font-size: 16px;
        line-height: 22px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 16px;
      }
      button {
        font: inherit;
        padding: 6px 12px;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e9ecf5;
          --page: #12162b;
        }
      }
    </style>
  </head>
  <body>
    <h1>Let Scout hear you</h1>
    <p>
      Scout listens only while you hold the mic button in the Tagalong popup. Audio goes only to
      your own brain and is never stored; with the brain on this computer it never leaves it.
    </p>
    <button id="allow" type="button">Allow microphone</button>
    <p id="result" role="status"></p>
    <script type="module" src="./mic.ts"></script>
  </body>
</html>
